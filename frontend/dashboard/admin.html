<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharaohs School | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-wrapper">
        <aside class="dashboard-sidebar" id="dashboardSidebar">
            <div class="sidebar-header d-flex align-items-center gap-2">
                <img src="../assets/images/logo.png" alt="Logo" class="logo-img">
                <span>Pharaohs School</span>
            </div>
            <ul class="sidebar-nav list-unstyled mb-0">
                <li><a href="#" class="active"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
                <li><a href="#students"><i class="bi bi-mortarboard-fill"></i> Students</a></li>
                <li><a href="#teachers"><i class="bi bi-person-workspace"></i> Teachers</a></li>
                <li><a href="#subjects"><i class="bi bi-journal-text"></i> Subjects</a></li>
                <li><a href="#"><i class="bi bi-bar-chart-fill"></i> Grades</a></li>
                <li><a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
            </ul>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="dashboard-main">
            <header class="dashboard-topbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle" type="button">
                        <i class="bi bi-list"></i>
                    </button>
                    <h1 class="h4 mb-0">Admin Dashboard</h1>
                </div>
                <div class="user-badge">
                    <i class="bi bi-person-circle"></i>
                    <div>
                        <p class="mb-0 fw-semibold" id="userNameLabel">Admin User</p>
                        <small id="userRoleLabel">Role: Admin</small>
                    </div>
                </div>
            </header>
            <div id="appMessage" class="alert d-none mt-3" role="alert"></div>

            <section id="students" class="dashboard-section">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0">Students Management</h2>
                            <button class="btn btn-gold btn-sm" id="addStudentBtn">Add Student</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Name</th>
                                        <th>Class</th>
                                        <th>Age</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="studentsTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

            <section id="teachers" class="dashboard-section">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0">Teachers Management</h2>
                            <button class="btn btn-gold btn-sm" id="addTeacherBtn">Add Teacher</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Name</th>
                                        <th>Subject</th>
                                    </tr>
                                </thead>
                                <tbody id="teachersTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

            <section id="subjects" class="dashboard-section">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0">Subjects</h2>
                            <button class="btn btn-gold btn-sm" id="addSubjectBtn">Add Subject</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Subject Name</th>
                                    </tr>
                                </thead>
                                <tbody id="subjectsTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
