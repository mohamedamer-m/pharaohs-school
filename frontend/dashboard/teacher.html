<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharaohs School | Teacher Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-wrapper">
        <aside class="dashboard-sidebar" id="dashboardSidebar">
            <div class="sidebar-header d-flex align-items-center gap-2">
                <img src="../assets/images/logo.png" alt="Logo" class="logo-img">
                <span>Pharaohs School</span>
            </div>
            <ul class="sidebar-nav list-unstyled mb-0">
                <li><a href="#" class="active"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
                <li><a href="#students"><i class="bi bi-mortarboard-fill"></i> Students</a></li>
                <li><a href="#"><i class="bi bi-person-workspace"></i> Teachers</a></li>
                <li><a href="#"><i class="bi bi-journal-text"></i> Subjects</a></li>
                <li><a href="#add-grades"><i class="bi bi-bar-chart-fill"></i> Grades</a></li>
                <li><a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
            </ul>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="dashboard-main">
            <header class="dashboard-topbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle" type="button">
                        <i class="bi bi-list"></i>
                    </button>
                    <h1 class="h4 mb-0">Teacher Dashboard</h1>
                </div>
                <div class="user-badge">
                    <i class="bi bi-person-circle"></i>
                    <div>
                        <p class="mb-0 fw-semibold" id="userNameLabel">Teacher Name</p>
                        <small id="userRoleLabel">Role: Teacher</small>
                    </div>
                </div>
            </header>
            <div id="appMessage" class="alert d-none mt-3" role="alert"></div>

            <section id="students" class="dashboard-section">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Students List</h2>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Student Name</th>
                                        <th>Class</th>
                                    </tr>
                                </thead>
                                <tbody id="teacherStudentsBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

            <section id="add-grades" class="dashboard-section">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Add Grades</h2>
                        <form id="gradeForm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="gradeStudent" class="form-label">Select Student</label>
                                    <select id="gradeStudent" class="form-select" required>
                                        <option value="">Choose...</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="gradeSubject" class="form-label">Select Subject</label>
                                    <select id="gradeSubject" class="form-select" required>
                                        <option value="">Choose...</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="gradeValue" class="form-label">Enter Grade</label>
                                    <input type="text" id="gradeValue" class="form-control" placeholder="e.g. A+" required>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-gold">Submit Grade</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
